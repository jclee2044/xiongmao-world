<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#7b8f79" />
    <title>Xiongmao World 熊猫世界</title>
    <link rel="icon" href="/assets/panda.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/icon-192.png" />
    <link rel="stylesheet" href="/styles-v9.css" />
  </head>
  <body>
    <main class="welcome" id="welcome">
      <img
        class="welcome-panda"
        src="/assets/panda.png"
        alt="Panda, your round cream-and-black plush companion"
      />
      <h1>Xiongmao World 熊猫世界</h1>
      <button class="primary" id="begin">
        Wander with Panda <span aria-hidden="true">↗</span>
      </button>
    </main>
    <main class="game" id="game" hidden>
      <header class="topbar">
        <div class="place">
          <span class="eyebrow" id="place-cn" lang="zh-CN">苏州 · 河巷</span>
          <h1 id="place">Suzhou · Canal Lane</h1>
          <div class="xp-meter">
            <progress id="xp-progress" value="0" max="500"></progress
            ><span id="xp-text">0 / 500 XP</span>
          </div>
        </div>
        <nav aria-label="Your world">
          <button id="update" hidden aria-label="Apply update">Update</button
          ><button id="home" aria-label="Home" title="Home">
            ⌂ <span>Home</span></button
          ><button id="map" aria-label="Map">⌖ <span>Map</span></button
          ><button id="journal" aria-label="Journal">
            ▤ <span>Journal</span></button
          ><button id="settings" aria-label="Settings">
            ⚙ <span>Settings</span>
          </button>
        </nav>
      </header>
      <section class="world-wrap" aria-label="Neighborhood">
        <canvas
          id="world"
          tabindex="0"
          aria-label="Explore the courtyard with WASD or arrow keys. Press Space near a person or object. Touch controls are below."
        ></canvas>
        <aside id="goals" aria-label="Panda’s goals">
          <details open>
            <summary>熊猫的小目标 <span>Panda’s goals</span></summary>
            <ol id="goals-list"></ol>
          </details>
        </aside>
        <div id="discovery" popover="manual" aria-live="polite" hidden></div>
        <div class="scene-note">
          <span class="dot"></span><span id="mode">Suzhou</span>
        </div>
        <aside class="panda-bubble">
          <img src="/assets/panda.png" alt="" />
          <div>
            <span id="panda-message">帮助</span>
            <details id="panda-help">
              <summary aria-label="Expand Panda’s help">▾</summary>
              <p id="panda-explanation">我们一起去河边走走吧。</p>
            </details>
          </div>
        </aside>
      </section>
      <footer class="bottom-bar">
        <div class="controls" aria-label="Movement controls">
          <button data-direction="arrowup" aria-label="Walk up">↑</button
          ><button data-direction="arrowleft" aria-label="Walk left">←</button
          ><button data-direction="arrowdown" aria-label="Walk down">↓</button
          ><button data-direction="arrowright" aria-label="Walk right">
            →
          </button>
        </div>
        <div class="control-note">
          WASD / arrows · Space to interact<br /><span id="save-status"
            >Loading save…</span
          >
        </div>
        <button class="primary" id="interact" disabled>四处走走</button>
      </footer>
    </main>
    <dialog id="conversation" class="conversation">
      <div class="dialog-heading">
        <span id="npc-name">Mei · 梅</span
        ><button
          class="close"
          data-close="conversation"
          aria-label="Close conversation"
        >
          ×
        </button>
      </div>
      <button id="foreground-panda" aria-label="Ask Panda for help">
        <img src="/assets/panda.png" alt="" width="60" height="60" /><span
          >Ask Panda</span
        >
      </button>
      <div class="conversation-body">
        <p id="last-user" class="muted"></p>
        <p id="npc-zh" class="chinese" lang="zh-CN">你好！欢迎你。</p>
        <p id="npc-pinyin" class="pinyin"></p>
        <p id="npc-meaning" class="meaning"></p>
        <div class="small-actions" id="speech-controls">
          <button id="toggle-pinyin" type="button" aria-pressed="true">
            Hide pinyin
          </button>
          <button id="replay">↻ Replay</button
          ><button id="slow-replay">Replay slowly</button
          ><button id="stop-speech">Stop voice</button
          ><button id="more-help">More help</button
          ><button id="less-help">Less help</button>
        </div>
        <p id="help-inline" class="notice"></p>
      </div>
      <form id="reply-form">
        <label for="reply">Your turn · say what’s on your mind</label>
        <div class="reply-row">
          <input
            id="reply"
            maxlength="500"
            autocomplete="off"
            placeholder="你好！我想吃面。"
          /><button class="primary" id="send">Send ↗</button>
        </div>
      </form>
      <p id="dialog-status" role="status" class="muted"></p>
      <p id="reply-notice" class="muted"></p>
    </dialog>
    <dialog id="panel">
      <div class="dialog-heading">
        <h2 id="panel-title"></h2>
        <button class="close" data-close="panel" aria-label="Close panel">
          ×
        </button>
      </div>
      <div id="panel-content"></div>
    </dialog>
    <dialog id="panda-coach" aria-labelledby="coach-title">
      <button
        class="close"
        data-close="panda-coach"
        aria-label="Close Panda help"
      >
        ×
      </button>
      <img
        class="coach-portrait"
        width="130"
        height="130"
        src="/assets/panda.png"
        alt="Panda"
      />
      <div class="coach-bubble">
        <h2 id="coach-title">熊猫来帮你 · Panda’s here</h2>
        <p id="coach-zh" class="chinese" lang="zh-CN"></p>
        <p id="coach-tip"></p>
        <p id="coach-pinyin" class="pinyin" hidden></p>
        <div class="small-actions">
          <button id="coach-listen">听一听</button
          ><button id="coach-next"></button
          ><button id="coach-use" hidden>Try this phrase</button
          ><button data-close="panda-coach">Back to our conversation</button>
        </div>
        <form id="coach-form">
          <label for="coach-question">Ask Panda about Chinese</label>
          <div class="coach-question-row">
            <input
              id="coach-question"
              maxlength="500"
              placeholder="How do I say…? Why is 吗 used here?"
              required
            /><button id="coach-send" class="primary">Ask</button>
          </div>
          <p id="coach-status" role="status"></p>
        </form>
      </div>
    </dialog>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
