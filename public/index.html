<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#7b8f79" />
    <title>熊猫世界</title>
    <link rel="icon" href="/assets/panda.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/icon-192.png" />
    <link rel="stylesheet" href="/styles-v9.css" />
  </head>
  <body>
    <main class="welcome" id="welcome">
      <img
        class="welcome-panda"
        src="/assets/panda.png"
        alt="陪你一起玩的熊猫"
      />
      <h1>熊猫世界</h1>
      <button class="primary" id="begin">
        和熊猫一起走走 <span aria-hidden="true">↗</span>
      </button>
    </main>
    <main class="game" id="game" hidden>
      <header class="topbar">
        <div class="place">
          <span class="eyebrow" id="place-cn" lang="zh-CN" hidden
            >苏州 · 河巷</span
          >
          <h1 id="place">苏州 · 河巷</h1>
          <div class="xp-meter">
            <progress id="xp-progress" value="0" max="500"></progress
            ><span id="xp-text">0 / 500 经验</span>
          </div>
        </div>
        <nav aria-label="你的世界">
          <button id="update" hidden aria-label="更新">更新</button
          ><button id="home" aria-label="回家" title="回家">
            ⌂ <span>回家</span></button
          ><button id="map" aria-label="地图">⌖ <span>地图</span></button
          ><button id="journal" aria-label="日记">▤ <span>日记</span></button
          ><button id="settings" aria-label="设置">⚙ <span>设置</span></button>
        </nav>
      </header>
      <section class="world-wrap" aria-label="河巷">
        <canvas
          id="world"
          tabindex="0"
          aria-label="按住或拖动屏幕走路，松开停止。也可以用 WASD 或方向键走路，走近后按空格键互动。"
        ></canvas>
        <aside id="goals" aria-label="熊猫的小目标">
          <details>
            <summary>熊猫的小目标</summary>
            <ol id="goals-list"></ol>
          </details>
        </aside>
        <div id="discovery" popover="manual" aria-live="polite" hidden></div>
        <div class="scene-note">
          <span class="dot"></span><span id="mode">苏州</span>
        </div>
        <aside class="panda-bubble" aria-label="熊猫的帮助">
          <button
            id="panda-toggle"
            aria-expanded="false"
            aria-controls="panda-content"
            aria-label="展开熊猫的帮助"
          >
            <span class="panda-face"
              ><img src="/assets/panda.png" alt=""
            /></span>
            <span id="panda-title">熊猫的帮助</span>
            <span id="panda-toggle-icon" aria-hidden="true">⌃</span>
          </button>
          <div id="panda-content" hidden>
            <p id="panda-message">帮助</p>
            <details id="panda-help">
              <summary>更多提示</summary>
              <p id="panda-explanation">我们一起去河边走走吧。</p>
            </details>
          </div>
        </aside>
      </section>
      <footer class="bottom-bar">
        <div class="control-note">
          WASD / 方向键走路 · 空格键说话或看看<br /><span id="save-status"
            >正在读日记…</span
          >
        </div>
      </footer>
    </main>
    <dialog id="conversation" class="conversation">
      <div class="dialog-heading">
        <span id="npc-name">梅</span
        ><button class="close" data-close="conversation" aria-label="结束聊天">
          ×
        </button>
      </div>
      <button id="foreground-panda" aria-label="问熊猫">
        <img src="/assets/panda.png" alt="" width="60" height="60" /><span
          >问熊猫</span
        >
      </button>
      <div class="conversation-body">
        <p id="last-user" class="muted"></p>
        <p id="npc-zh" class="chinese" lang="zh-CN">你好！欢迎你。</p>
        <p id="npc-pinyin" class="pinyin"></p>
        <p id="npc-meaning" class="meaning"></p>
        <div class="small-actions" id="speech-controls">
          <button id="toggle-pinyin" type="button" aria-pressed="true">
            不看拼音
          </button>
          <button id="replay">↻ 再听一次</button
          ><button id="slow-replay">慢慢听</button
          ><button id="stop-speech">停一下</button
          ><button id="more-help">多帮一点</button
          ><button id="less-help">少帮一点</button>
        </div>
        <p id="help-inline" class="notice"></p>
      </div>
      <form id="reply-form">
        <label for="reply">到你了，说说你想说的吧</label>
        <div class="reply-row">
          <input
            id="reply"
            maxlength="500"
            autocomplete="off"
            placeholder="你好！我想吃面。"
          /><button class="primary" id="send">说 ↗</button>
        </div>
      </form>
      <p id="dialog-status" role="status" class="muted"></p>
      <p id="reply-notice" class="muted"></p>
    </dialog>
    <dialog id="panel">
      <div class="dialog-heading">
        <h2 id="panel-title"></h2>
        <button class="close" data-close="panel" aria-label="关闭">×</button>
      </div>
      <div id="panel-content"></div>
    </dialog>
    <dialog id="panda-coach" aria-labelledby="coach-title">
      <button class="close" data-close="panda-coach" aria-label="关闭帮助">
        ×
      </button>
      <img
        class="coach-portrait"
        width="130"
        height="130"
        src="/assets/panda.png"
        alt="熊猫"
      />
      <div class="coach-bubble">
        <h2 id="coach-title">熊猫来帮你</h2>
        <p id="coach-zh" class="chinese" lang="zh-CN"></p>
        <p id="coach-tip"></p>
        <p id="coach-pinyin" class="pinyin" hidden></p>
        <div class="small-actions">
          <button id="coach-listen">听一听</button
          ><button id="coach-next"></button
          ><button id="coach-use" hidden>试着说这句</button
          ><button data-close="panda-coach">回去聊天</button>
        </div>
        <form id="coach-form">
          <label for="coach-question">问熊猫一个中文问题</label>
          <div class="coach-question-row">
            <input
              id="coach-question"
              maxlength="500"
              placeholder="这句话怎么说？这里为什么用“吗”？"
              required
            /><button id="coach-send" class="primary">问问</button>
          </div>
          <p id="coach-status" role="status"></p>
        </form>
      </div>
    </dialog>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
